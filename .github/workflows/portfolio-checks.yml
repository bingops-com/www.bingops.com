name: Portfolio build and browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/portfolio-refresh]

concurrency:
  group: portfolio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile
        run: npm run test:e2e
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 14
